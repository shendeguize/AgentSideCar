name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || (github.event_name == 'push' && fromJSON('["macos-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]')) }}
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install '.[dev]'

      - name: Assert zero runtime dependencies
        run: |
          python - <<'PY'
          try:
              import tomllib
          except ModuleNotFoundError:
              from pip._vendor import tomli as tomllib

          from pathlib import Path

          document = Path("pyproject.toml").read_text(encoding="utf-8")
          project = tomllib.loads(document)["project"]
          dependencies = project.get("dependencies")
          if dependencies != []:
              raise SystemExit(
                  "project.dependencies must remain an explicit empty array; got {!r}".format(
                      dependencies
                  )
              )
          print("project runtime dependencies: 0")
          PY

      - name: Run repository quality gate
        run: python scripts/check.py
