name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, Python ${{ matrix.python-version }})
    # Python 3.13 no longer raises RecursionError for deeply nested JSON, while
    # the current resource-limit contract test still relies on that behavior.
    # Keep the upper-bound lane visible without weakening the required 3.9 lane.
    continue-on-error: ${{ matrix.python-version == '3.13' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || (github.event_name == 'push' && fromJSON('["macos-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]')) }}
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install '.[dev]'

      - name: Harden Python toolchain permissions
        run: |
          python - <<'PY'
          import stat
          import subprocess
          import sys
          from pathlib import Path

          executable = Path(sys.executable)
          candidates = []
          for entry in (executable, executable.resolve()):
              candidates.extend((entry,) + tuple(entry.parents))
          for path in dict.fromkeys(candidates):
              details = path.lstat()
              mode = stat.S_IMODE(details.st_mode)
              if path.is_symlink() or mode & 0o022 == 0:
                  continue
              subprocess.run(
                  ("sudo", "chmod", "go-w", str(path)),
                  check=True,
              )
          PY

      - name: Assert zero runtime dependencies
        run: |
          python - <<'PY'
          try:
              import tomllib
          except ModuleNotFoundError:
              from pip._vendor import tomli as tomllib

          from pathlib import Path

          document = Path("pyproject.toml").read_text(encoding="utf-8")
          project = tomllib.loads(document)["project"]
          dependencies = project.get("dependencies")
          if dependencies != []:
              raise SystemExit(
                  "project.dependencies must remain an explicit empty array; got {!r}".format(
                      dependencies
                  )
              )
          print("project runtime dependencies: 0")
          PY

      - name: Run repository quality gate
        run: python scripts/check.py
