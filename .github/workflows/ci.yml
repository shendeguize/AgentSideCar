name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re

          pattern = (
              r"^(feat|fix|docs|test|chore|refactor|ci)"
              r"(\([a-z0-9][a-z0-9._-]*\))?!?: .+"
          )
          title = os.environ["PR_TITLE"]
          if re.fullmatch(pattern, title) is None:
              raise SystemExit(
                  "PR title must match Conventional Commits: "
                  "type(scope)!: description"
              )
          print("valid PR title: {}".format(title))
          PY

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and verify actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "${archive_path}" \
            "${url}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive_path}" \
            | sha256sum --check --strict
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}" actionlint
          chmod +x "${RUNNER_TEMP}/actionlint"
          "${RUNNER_TEMP}/actionlint" -version
          "${RUNNER_TEMP}/actionlint" -color

  check:
    name: check (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || (github.event_name == 'push' && fromJSON('["macos-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]')) }}
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install '.[dev]'

      - name: Harden Python toolchain permissions
        run: |
          python - <<'PY'
          import stat
          import subprocess
          import sys
          from pathlib import Path

          executable = Path(sys.executable)
          candidates = []
          for entry in (executable, executable.resolve()):
              candidates.extend((entry,) + tuple(entry.parents))
          for path in dict.fromkeys(candidates):
              details = path.lstat()
              mode = stat.S_IMODE(details.st_mode)
              if path.is_symlink() or mode & 0o022 == 0:
                  continue
              subprocess.run(
                  ("sudo", "chmod", "go-w", str(path)),
                  check=True,
              )
          PY

      - name: Assert zero runtime dependencies
        run: |
          python - <<'PY'
          try:
              import tomllib
          except ModuleNotFoundError:
              from pip._vendor import tomli as tomllib

          from pathlib import Path

          document = Path("pyproject.toml").read_text(encoding="utf-8")
          project = tomllib.loads(document)["project"]
          dependencies = project.get("dependencies")
          if dependencies != []:
              raise SystemExit(
                  "project.dependencies must remain an explicit empty array; got {!r}".format(
                      dependencies
                  )
              )
          print("project runtime dependencies: 0")
          PY

      - name: Run repository quality gate
        # Pull requests use the required 3.9 gate; Python 3.13 runs in the
        # push/weekly matrices so PR feedback does not repeat the full suite.
        if: github.event_name != 'pull_request' || matrix.python-version == '3.9'
        id: quality_gate
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set +e
          set -o pipefail
          python scripts/check.py --fast 2>&1 | tee "${RUNNER_TEMP}/quality-gate.log"
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          if [[ "${PYTHON_VERSION}" != "3.13" ]]; then
            exit "${exit_code}"
          fi

      # Python 3.13's iterative JSON decoder no longer raises RecursionError for
      # deeply nested input. Accept only that known contract-test error until
      # product code enforces its own nesting bound; any additional error fails.
      - name: Verify Python 3.13 known limitation
        if: matrix.python-version == '3.13' && github.event_name != 'pull_request'
        env:
          QUALITY_EXIT_CODE: ${{ steps.quality_gate.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          exit_code = int(os.environ["QUALITY_EXIT_CODE"])
          log = (Path(os.environ["RUNNER_TEMP"]) / "quality-gate.log").read_text(
              encoding="utf-8"
          )
          expected_error = (
              "ERROR: test_bootstrap_maps_json_recursion_exhaustion_to_resource_limit"
          )
          expected_summary = r"FAILED \(errors=1(?:, skipped=\d+)?\)"
          if (
              exit_code != 1
              or expected_error not in log
              or log.count("\nERROR: ") != 1
              or re.search(expected_summary, log) is None
          ):
              raise SystemExit(
                  "Python 3.13 failed outside its single known JSON-depth limitation"
              )
          print("accepted known Python 3.13 JSON-depth limitation")
          PY

      - name: Complete Python 3.13 non-test stages
        if: matrix.python-version == '3.13' && github.event_name != 'pull_request'
        run: |
          python scripts/check.py \
            --only pack \
            --only cli \
            --only skill

  remote-python-3-8:
    name: Remote payload (Python 3.8)
    runs-on: ubuntu-latest
    container: python:3.8-slim
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run remote payload suites
        run: python -m unittest tests/test_remote.py tests/test_remote_watch.py
