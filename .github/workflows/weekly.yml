name: Weekly regression

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: regression (${{ matrix.os }}, Python 3.13)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install '.[dev]'

      - name: Harden Python toolchain permissions
        run: |
          python - <<'PY'
          import stat
          import subprocess
          import sys
          from pathlib import Path

          executable = Path(sys.executable)
          candidates = []
          for entry in (executable, executable.resolve()):
              candidates.extend((entry,) + tuple(entry.parents))
          for path in dict.fromkeys(candidates):
              details = path.lstat()
              mode = stat.S_IMODE(details.st_mode)
              if path.is_symlink() or mode & 0o022 == 0:
                  continue
              subprocess.run(("sudo", "chmod", "go-w", str(path)), check=True)
          PY

      - name: Run full repository quality gate
        id: quality_gate
        run: |
          set +e
          set -o pipefail
          python scripts/check.py 2>&1 | tee "${RUNNER_TEMP}/quality-gate.log"
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      # Python 3.13's iterative JSON decoder no longer raises RecursionError for
      # deeply nested input. Accept only that known contract-test error until
      # product code enforces its own nesting bound; any additional error fails.
      - name: Verify Python 3.13 known limitation
        env:
          QUALITY_EXIT_CODE: ${{ steps.quality_gate.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          exit_code = int(os.environ["QUALITY_EXIT_CODE"])
          if exit_code == 0:
              print("full Python 3.13 quality gate passed")
              raise SystemExit(0)
          log = (Path(os.environ["RUNNER_TEMP"]) / "quality-gate.log").read_text(
              encoding="utf-8"
          )
          expected_error = (
              "ERROR: test_bootstrap_maps_json_recursion_exhaustion_to_resource_limit"
          )
          expected_summary = r"FAILED \(errors=1(?:, skipped=\d+)?\)"
          if (
              exit_code != 1
              or expected_error not in log
              or log.count("\nERROR: ") != 1
              or re.search(expected_summary, log) is None
          ):
              raise SystemExit(
                  "Python 3.13 failed outside its single known JSON-depth limitation"
              )
          print("accepted known Python 3.13 JSON-depth limitation")
          PY

      - name: Complete Python 3.13 non-test stages
        if: steps.quality_gate.outputs.exit_code != '0'
        run: |
          python scripts/check.py \
            --only pack \
            --only cli \
            --only skill
