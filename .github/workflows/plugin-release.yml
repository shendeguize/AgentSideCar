name: Plugin Release

on:
  push:
    tags:
      - "plugin-v*"

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: plugin

    steps:
      - name: Check out plugin tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#plugin-v}"
          semver_tag='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$'
          if [[ ! "${tag}" =~ ${semver_tag} ]]; then
            echo "plugin tag is not strict SemVer: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${package_version}" != "${tag}" ]]; then
            echo "plugin package version ${package_version} does not match ${tag}" >&2
            exit 1
          fi
          echo "publishing @shendeguize/dsh-agent-sidecar@${package_version}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          corepack enable pnpm
          corepack install --global \
            "$(node -p "require('./package.json').packageManager")"
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run plugin tests
        run: pnpm test

      - name: Typecheck and build once
        run: pnpm typecheck && pnpm build

      - name: Verify committed bundles
        run: |
          drift="$(git status --porcelain -- lib \
            ':!lib/client.js' ':!lib/client.js.map')"
          if [[ -n "${drift}" ]]; then
            echo "${drift}" >&2
            exit 1
          fi

      - name: Publish with npm Trusted Publishing
        run: npm publish --access public --provenance --ignore-scripts
