[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sidecar"
dynamic = ["version"]
description = "A local-first CLI for observing AI-agent sessions"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "shendeguize"}]
requires-python = ">=3.9"
dependencies = []
keywords = [
    "ai-agents",
    "cli",
    "observability",
    "session-monitoring",
]

[project.optional-dependencies]
dev = [
    "coverage==7.10.7",
    "ruff==0.15.12",
]

[project.urls]
Homepage = "https://github.com/shendeguize/AgentSideCar"
Repository = "https://github.com/shendeguize/AgentSideCar.git"
Issues = "https://github.com/shendeguize/AgentSideCar/issues"
Changelog = "https://github.com/shendeguize/AgentSideCar/blob/main/CHANGELOG.md"

[project.scripts]
agent-sidecar = "sidecar.cli:main"

[tool.setuptools.dynamic]
version = {attr = "sidecar.__version__"}

[tool.setuptools.packages.find]
include = ["sidecar*"]
exclude = ["tests*"]

[tool.coverage.run]
branch = true
source = ["sidecar"]
relative_files = true
patch = ["subprocess"]

[tool.coverage.paths]
source = [
    "sidecar",
    "*/site-packages/sidecar",
]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["sidecar", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Existing imports predate Ruff; keep the baseline surgical while requiring
# sorted imports in new tooling. Remove these exceptions as legacy files change.
"sidecar/**/*.py" = ["I001"]
"tests/**/*.py" = ["I001"]
