[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sidecar"
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agent-sidecar = "sidecar.cli:main"

[tool.setuptools.dynamic]
version = {attr = "sidecar.__version__"}

[tool.setuptools.packages.find]
include = ["sidecar*"]
exclude = ["tests*"]
